# Install deps with uv (project tooling) on the pyproject-required Python and run the
# test suite. The stock setup-python/requirements.txt starter this replaces could never
# pass here: it ran 3.9-3.11 (pyproject requires >=3.14), never installed the pyproject
# dependencies, and never made `praevisa` importable, so pytest errored at collection.

name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Sync dependencies
        run: uv sync
      # pytest is not a project dependency, so add it ephemerally with --with; PYTHONPATH=.
      # makes `praevisa` importable (pyproject declares no [build-system], so uv does not
      # install the root package and pytest won't otherwise find it).
      - name: Run tests
        env:
          PYTHONPATH: .
        run: uv run --with pytest pytest -q
